name: Reviewed upstream sync

on:
  schedule:
    - cron: "17 17 * * 6"
  workflow_dispatch:

permissions: {}

concurrency:
  group: steel-managed-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: steel-dev/steel-browser
  UPSTREAM_URL: https://github.com/steel-dev/steel-browser.git
  MIRROR_BRANCH: main
  MANAGED_BRANCH: managed
  REVIEW_ACKNOWLEDGEMENT_ROOT: managed/tests/upstream-acknowledgements

jobs:
  candidate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sync_status: ${{ steps.generate.outputs.sync_status || steps.capture.outputs.sync_status }}
      source_sha: ${{ steps.capture.outputs.source_sha }}
      managed_sha: ${{ steps.capture.outputs.managed_sha }}
      sync_branch: ${{ steps.capture.outputs.sync_branch }}
      capture_status: ${{ steps.capture.outputs.capture_status }}
      capture_binding_sha256: ${{ steps.capture.outputs.capture_binding_sha256 }}
    steps:
      - name: Check out protected managed baseline without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: managed
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install trusted managed verifier dependencies
        run: npm ci --ignore-scripts

      - name: Verify sync automation contract
        run: |
          set -euo pipefail
          node scripts/upstream-sync/verify-workflow.mjs
          node --test scripts/upstream-sync/*.test.mjs

      - name: Resolve and capture an unprivileged exact runtime
        id: capture
        shell: bash
        run: bash scripts/upstream-sync/candidate.sh capture

      - name: Upload immutable pre-gate runtime capture
        if: steps.capture.outputs.capture_status == 'captured'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: steel-upstream-capture-${{ steps.capture.outputs.source_sha }}-${{ steps.capture.outputs.capture_binding_sha256 }}
          path: ${{ runner.temp }}/steel-upstream-sync
          if-no-files-found: error
          retention-days: 14

      - name: Remove mutable pre-upload capture copy
        if: steps.capture.outputs.capture_status == 'captured'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP:?}/steel-upstream-sync"

      - name: Download immutable pre-gate runtime capture
        if: steps.capture.outputs.capture_status == 'captured'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: steel-upstream-capture-${{ steps.capture.outputs.source_sha }}-${{ steps.capture.outputs.capture_binding_sha256 }}
          path: ${{ runner.temp }}/steel-upstream-sync

      - name: Generate and test an unprivileged candidate
        if: steps.capture.outputs.capture_status == 'captured'
        id: generate
        shell: bash
        run: bash scripts/upstream-sync/candidate.sh generate

      - name: Upload immutable candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: steel-upstream-sync-${{ steps.capture.outputs.source_sha || github.run_id }}
          path: ${{ runner.temp }}/steel-upstream-sync
          if-no-files-found: error
          retention-days: 14

  publish:
    if: needs.candidate.outputs.sync_status == 'ready' || needs.candidate.outputs.sync_status == 'no-change'
    needs: candidate
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out managed publisher baseline without candidate credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: managed
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm

      - name: Download candidate evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: steel-upstream-sync-${{ needs.candidate.outputs.source_sha || github.run_id }}
          path: sync-artifact

      - name: Download immutable pre-gate runtime capture
        if: needs.candidate.outputs.sync_status == 'ready'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: steel-upstream-capture-${{ needs.candidate.outputs.source_sha }}-${{ needs.candidate.outputs.capture_binding_sha256 }}
          path: trusted-capture

      - name: Install trusted verifier dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Publish only the verified candidate bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPECTED_CAPTURE_BINDING_SHA256: ${{ needs.candidate.outputs.capture_binding_sha256 }}
        shell: bash
        run: bash scripts/upstream-sync/publisher.sh

  report-blocked:
    if: needs.candidate.outputs.sync_status == 'blocked'
    needs: candidate
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download blocked classification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: steel-upstream-sync-${{ needs.candidate.outputs.source_sha || github.run_id }}
          path: sync-artifact

      - name: Report one deduplicated blocked review item
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(jq -r '.sourceSha' sync-artifact/candidate-metadata.json)"
          CATEGORIES="$(jq -ce '.categories | if type == "array" then . else error("categories must be an array") end' sync-artifact/classification.json)"
          BLOCKED_REASONS="$(jq -ce '.blockedReasons | if type == "array" then . else error("blockedReasons must be an array") end' sync-artifact/classification.json)"
          UPSTREAM_COMMITS="$(jq -ce '.upstreamTraceability.commits | if type == "array" then . else error("upstream commits must be an array") end' sync-artifact/classification.json)"
          RELEASE_NOTES="$(jq -ce '.upstreamTraceability.releaseNotes | if type == "object" then . else error("release note traceability must be an object") end' sync-artifact/classification.json)"
          MIGRATION_NOTES="$(jq -ce '.upstreamTraceability.migrationNotes | if type == "object" then . else error("migration note traceability must be an object") end' sync-artifact/classification.json)"
          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BLOCKED_ARTIFACT_NAME="steel-upstream-sync-${SOURCE_SHA}"
          TITLE="upstream sync blocked: ${SOURCE_SHA}"
          BODY="$(cat <<EOF
          The reviewed upstream sync is blocked and did not create a candidate branch or PR.

          Source SHA: \`${SOURCE_SHA}\`
          Categories: ${CATEGORIES}
          Blocked reasons: ${BLOCKED_REASONS}
          Upstream source-range commits: ${UPSTREAM_COMMITS}
          Release-note evidence: ${RELEASE_NOTES}
          Migration-note evidence: ${MIGRATION_NOTES}
          Workflow run: ${RUN_URL}
          Blocked evidence artifact: \`${BLOCKED_ARTIFACT_NAME}\`
          Key artifact paths: \`classification.json\`, \`candidate-metadata.json\`

          Inspect the bound runtime-capture evidence when present, then complete the listed review
          or acknowledgement before rerunning sync. The workflow never copies an older receipt.
          EOF
          )"
          gh label create "status: blocked" --repo "${GITHUB_REPOSITORY}" --color "B60205" --description "Upstream sync requires human review" --force
          ISSUE_NUMBER="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "${TITLE} in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "${ISSUE_NUMBER}" ]]; then
            gh issue edit "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --body "${BODY}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --body "${BODY}" --label "status: blocked"
          fi
