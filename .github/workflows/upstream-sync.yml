name: Reviewed upstream sync

on:
  schedule:
    - cron: "17 2 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: steel-managed-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: steel-dev/steel-browser
  UPSTREAM_URL: https://github.com/steel-dev/steel-browser.git
  MIRROR_BRANCH: main
  MANAGED_BRANCH: managed
  OBSERVED_CORPUS_ROOT: managed/tests/upstream-observations

jobs:
  candidate:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sync_status: ${{ steps.candidate.outputs.sync_status }}
      source_sha: ${{ steps.candidate.outputs.source_sha }}
      managed_sha: ${{ steps.candidate.outputs.managed_sha }}
      sync_branch: ${{ steps.candidate.outputs.sync_branch }}
    steps:
      - name: Check out protected managed baseline without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: managed
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm

      - name: Verify sync automation contract
        run: |
          set -euo pipefail
          node scripts/upstream-sync/verify-workflow.mjs
          node --test scripts/upstream-sync/*.test.mjs

      - name: Resolve and test an unprivileged candidate
        id: candidate
        shell: bash
        env:
          READ_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARTIFACT_ROOT="${RUNNER_TEMP}/steel-upstream-sync"
          mkdir -p "${ARTIFACT_ROOT}"

          if [[ "${GITHUB_REPOSITORY}" == "${UPSTREAM_REPOSITORY}" ]]; then
            echo "canonical upstream repository is not a writable fork" >&2
            exit 1
          fi
          if [[ -z "${GITHUB_REPOSITORY_OWNER}" || -z "${GITHUB_REPOSITORY}" ]]; then
            echo "fork repository identity is missing" >&2
            exit 1
          fi

          git remote add upstream "${UPSTREAM_URL}"
          UPSTREAM_DEFAULT_BRANCH="$(git ls-remote --symref "${UPSTREAM_URL}" HEAD | awk '$1 == "ref:" && $2 ~ /^refs\/heads\// {sub(/^refs\/heads\//, "", $2); print $2; exit}')"
          if [[ -z "${UPSTREAM_DEFAULT_BRANCH}" || ! "${UPSTREAM_DEFAULT_BRANCH}" =~ ^[A-Za-z0-9._/-]+$ ]] || ! git check-ref-format "refs/heads/${UPSTREAM_DEFAULT_BRANCH}"; then
            echo "canonical upstream default branch could not be resolved safely" >&2
            exit 1
          fi
          git fetch --no-tags upstream "${UPSTREAM_DEFAULT_BRANCH}"
          git -c "http.extraheader=AUTHORIZATION: bearer ${READ_TOKEN}" fetch --no-tags origin "${MANAGED_BRANCH}" "${MIRROR_BRANCH}" || {
            echo "read-only origin fetch failed; refusing to guess whether a ref is absent" >&2
            exit 1
          }
          unset READ_TOKEN GITHUB_TOKEN GH_TOKEN PUBLISH_TOKEN ACTIONS_RUNTIME_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL

          SOURCE_SHA="$(git rev-parse "refs/remotes/upstream/${UPSTREAM_DEFAULT_BRANCH}")"
          MANAGED_SHA="$(git rev-parse "refs/remotes/origin/${MANAGED_BRANCH}")"
          LOCK_SHA="$(node --input-type=module -e 'import { readFile } from "node:fs/promises"; const lock = JSON.parse(await readFile("managed/upstream.lock.json", "utf8")); process.stdout.write(lock.upstreamSha)')"
          SYNC_BRANCH="upstream-sync/${SOURCE_SHA}"
          printf 'SOURCE_SHA=%s\nMANAGED_SHA=%s\nSYNC_BRANCH=%s\n' "${SOURCE_SHA}" "${MANAGED_SHA}" "${SYNC_BRANCH}" >> "${GITHUB_ENV}"
          printf 'source_sha=%s\nmanaged_sha=%s\nsync_branch=%s\n' "${SOURCE_SHA}" "${MANAGED_SHA}" "${SYNC_BRANCH}" >> "${GITHUB_OUTPUT}"

          verify_upstream_delta() {
            while IFS= read -r -d '' changed_path; do
              case "${changed_path}" in
                managed/*|.github/workflows/*|.github/CODEOWNERS|.github/rulesets/*|scripts/upstream-sync/*)
                  echo "upstream changed fork-owned automation or managed policy: ${changed_path}" >&2
                  return 1
                  ;;
              esac
            done < <(git diff --name-only -z --find-renames "${MANAGED_SHA}...${SOURCE_SHA}")
          }

          write_blocked_classification() {
            local observation_flag=()
            if [[ -d "${OBSERVED_CORPUS_ROOT}/${SOURCE_SHA}" ]]; then
              observation_flag=(--observation-available)
            fi
            node scripts/upstream-sync/classify-upstream.mjs \
              --managed-sha "${MANAGED_SHA}" \
              --source-sha "${SOURCE_SHA}" \
              --lock-sha "${LOCK_SHA}" \
              "${observation_flag[@]}" \
              --output "${ARTIFACT_ROOT}/classification.json"
            printf '{"schemaVersion":1,"status":"BLOCKED","sourceSha":"%s","managedSha":"%s"}\n' "${SOURCE_SHA}" "${MANAGED_SHA}" > "${ARTIFACT_ROOT}/candidate-metadata.json"
            echo "sync_status=blocked" >> "${GITHUB_OUTPUT}"
          }

          verify_upstream_delta
          if [[ -d "${OBSERVED_CORPUS_ROOT}/${SOURCE_SHA}" ]]; then
            node scripts/upstream-sync/classify-upstream.mjs \
              --managed-sha "${MANAGED_SHA}" \
              --source-sha "${SOURCE_SHA}" \
              --lock-sha "${LOCK_SHA}" \
              --observation-available \
              --output "${ARTIFACT_ROOT}/classification.json"
          else
            node scripts/upstream-sync/classify-upstream.mjs \
              --managed-sha "${MANAGED_SHA}" \
              --source-sha "${SOURCE_SHA}" \
              --lock-sha "${LOCK_SHA}" \
              --output "${ARTIFACT_ROOT}/classification.json"
          fi

          if ! git merge-base --is-ancestor "${SOURCE_SHA}" "${MANAGED_SHA}"; then
            CLASSIFICATION_BLOCKED="$(CLASSIFICATION_PATH="${ARTIFACT_ROOT}/classification.json" node --input-type=module -e 'import { readFile } from "node:fs/promises"; const value = JSON.parse(await readFile(process.env.CLASSIFICATION_PATH, "utf8")); process.stdout.write(String(value.blocked))')"
            if [[ "${CLASSIFICATION_BLOCKED}" == "true" || ! -d "${OBSERVED_CORPUS_ROOT}/${SOURCE_SHA}" ]]; then
              echo "new upstream SHA requires an independently observed corpus; no receipt is copied" >&2
              write_blocked_classification
              exit 0
            fi
          else
            if [[ "${SOURCE_SHA}" != "${LOCK_SHA}" ]]; then
              echo "managed already contains the source but its lock/corpus is stale; refusing no-change publication" >&2
              write_blocked_classification
              exit 0
            fi
            printf '{"schemaVersion":1,"status":"NO_CHANGE","sourceSha":"%s","managedSha":"%s"}\n' "${SOURCE_SHA}" "${MANAGED_SHA}" > "${ARTIFACT_ROOT}/candidate-metadata.json"
            echo "sync_status=no-change" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --detach "${MANAGED_SHA}"
          git merge --no-edit --no-ff "${SOURCE_SHA}"
          MERGE_COMMIT_SHA="$(git rev-parse HEAD)"
          verify_upstream_delta

          npm ci
          node scripts/upstream-sync/prepare-corpus.mjs \
            --upstream-sha "${SOURCE_SHA}" \
            --observed-corpus-directory "${OBSERVED_CORPUS_ROOT}/${SOURCE_SHA}"
          node scripts/upstream-sync/classify-upstream.mjs \
            --managed-sha "${MANAGED_SHA}" \
            --source-sha "${SOURCE_SHA}" \
            --lock-sha "${LOCK_SHA}" \
            --merge-sha "${MERGE_COMMIT_SHA}" \
            --observation-available \
            --output "managed/tests/upstream/${SOURCE_SHA}/classification.json"
          npm run verify:upstream-corpus

          verify_generated_worktree() {
            while IFS= read -r -d '' changed_path; do
              case "${changed_path}" in
                managed/upstream.lock.json|managed/shared/src/upstream-observed-receipt.ts|managed/tests/upstream/${SOURCE_SHA}/*)
                  ;;
                .github/workflows/upstream-sync.yml)
                  echo "workflow self-modification is forbidden" >&2
                  return 1
                  ;;
                *)
                  echo "generated candidate changed an unauthorized path: ${changed_path}" >&2
                  return 1
                  ;;
              esac
            done < <(
              {
                git diff --name-only -z
                git diff --cached --name-only -z
                git ls-files --others --exclude-standard -z
              } | sort -zu
            )
          }

          verify_generated_worktree
          git switch -c "${SYNC_BRANCH}"
          git add -- managed/upstream.lock.json "managed/tests/upstream/${SOURCE_SHA}" managed/shared/src/upstream-observed-receipt.ts
          if git diff --cached --quiet; then
            echo "observed corpus preparation produced no committed changes" >&2
            exit 1
          fi
          while IFS= read -r -d '' staged_path; do
            case "${staged_path}" in
              managed/upstream.lock.json|managed/shared/src/upstream-observed-receipt.ts|managed/tests/upstream/${SOURCE_SHA}/*)
                ;;
              .github/workflows/upstream-sync.yml)
                echo "workflow file may not be part of generated candidate changes" >&2
                exit 1
                ;;
              *)
                echo "staged candidate path is outside the generated allowlist: ${staged_path}" >&2
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only -z)

          git commit -m "ci(managed): record observed upstream corpus ${SOURCE_SHA}"
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "candidate tree is not clean after the generated commit" >&2
            exit 1
          fi
          COMMITTED_PATHS="$(git diff-tree --no-commit-id --name-only -r HEAD)"
          grep -Fxq "managed/upstream.lock.json" <<<"${COMMITTED_PATHS}"
          grep -Fxq "managed/shared/src/upstream-observed-receipt.ts" <<<"${COMMITTED_PATHS}"
          grep -Fq "managed/tests/upstream/${SOURCE_SHA}/" <<<"${COMMITTED_PATHS}"
          if grep -Fxq ".github/workflows/upstream-sync.yml" <<<"${COMMITTED_PATHS}"; then
            echo "candidate commit contains workflow self-modification" >&2
            exit 1
          fi

          node --test scripts/upstream-sync/*.test.mjs
          npm run check:managed
          npm run test
          npm run build
          node scripts/upstream-sync/verify-license.mjs
          git diff --check

          CANDIDATE_COMMIT_SHA="$(git rev-parse HEAD)"
          CANDIDATE_TREE_SHA="$(git rev-parse HEAD^{tree})"
          node scripts/upstream-sync/verify-candidate-commit.mjs \
            --commit-sha "${CANDIDATE_COMMIT_SHA}" \
            --merge-commit-sha "${MERGE_COMMIT_SHA}" \
            --managed-sha "${MANAGED_SHA}" \
            --source-sha "${SOURCE_SHA}" \
            --tree-sha "${CANDIDATE_TREE_SHA}"
          git bundle create "${ARTIFACT_ROOT}/candidate.bundle" "refs/heads/${SYNC_BRANCH}" "^${MANAGED_SHA}"
          printf '{"schemaVersion":1,"status":"READY","sourceSha":"%s","managedSha":"%s","syncBranch":"%s","mergeCommitSha":"%s","candidateCommitSha":"%s","candidateTreeSha":"%s"}\n' \
            "${SOURCE_SHA}" "${MANAGED_SHA}" "${SYNC_BRANCH}" "${MERGE_COMMIT_SHA}" "${CANDIDATE_COMMIT_SHA}" "${CANDIDATE_TREE_SHA}" > "${ARTIFACT_ROOT}/candidate-metadata.json"
          echo "sync_status=ready" >> "${GITHUB_OUTPUT}"

      - name: Upload immutable candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: steel-upstream-sync-${{ steps.candidate.outputs.source_sha || github.run_id }}
          path: ${{ runner.temp }}/steel-upstream-sync
          if-no-files-found: error
          retention-days: 14

  publish:
    if: needs.candidate.outputs.sync_status == 'ready' || needs.candidate.outputs.sync_status == 'no-change'
    needs: candidate
    permissions:
      contents: write
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out managed publisher baseline without candidate credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: managed
          fetch-depth: 0
          persist-credentials: false

      - name: Download candidate evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: steel-upstream-sync-${{ needs.candidate.outputs.source_sha || github.run_id }}
          path: sync-artifact

      - name: Publish only the verified candidate bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          META_SOURCE_SHA="$(jq -r '.sourceSha' sync-artifact/candidate-metadata.json)"
          META_MANAGED_SHA="$(jq -r '.managedSha' sync-artifact/candidate-metadata.json)"
          META_STATUS="$(jq -r '.status' sync-artifact/candidate-metadata.json)"
          META_BRANCH="$(jq -r '.syncBranch // empty' sync-artifact/candidate-metadata.json)"
          META_MERGE_SHA="$(jq -r '.mergeCommitSha // empty' sync-artifact/candidate-metadata.json)"
          META_COMMIT_SHA="$(jq -r '.candidateCommitSha // empty' sync-artifact/candidate-metadata.json)"
          META_TREE_SHA="$(jq -r '.candidateTreeSha // empty' sync-artifact/candidate-metadata.json)"
          for value in "${META_SOURCE_SHA}" "${META_MANAGED_SHA}"; do
            [[ "${value}" =~ ^[0-9a-f]{40}$ ]] || { echo "candidate metadata SHA is invalid" >&2; exit 1; }
          done
          [[ "${META_STATUS}" == "READY" || "${META_STATUS}" == "NO_CHANGE" ]] || { echo "candidate metadata is not publishable" >&2; exit 1; }
          if [[ "${META_STATUS}" == "READY" ]]; then
            [[ "${META_BRANCH}" =~ ^upstream-sync/[0-9a-f]{40}$ ]] || { echo "candidate branch metadata is invalid" >&2; exit 1; }
          fi
          git remote add upstream "${UPSTREAM_URL}"
          UPSTREAM_DEFAULT_BRANCH="$(git ls-remote --symref "${UPSTREAM_URL}" HEAD | awk '$1 == "ref:" && $2 ~ /^refs\/heads\// {sub(/^refs\/heads\//, "", $2); print $2; exit}')"
          [[ "${UPSTREAM_DEFAULT_BRANCH}" =~ ^[A-Za-z0-9._/-]+$ ]] && git check-ref-format "refs/heads/${UPSTREAM_DEFAULT_BRANCH}" || { echo "upstream default branch could not be resolved safely" >&2; exit 1; }
          git -c "http.extraheader=AUTHORIZATION: bearer ${PUBLISH_TOKEN}" fetch --no-tags origin "${MANAGED_BRANCH}" "${MIRROR_BRANCH}"
          git fetch --no-tags upstream "${UPSTREAM_DEFAULT_BRANCH}"
          [[ "$(git rev-parse "refs/remotes/upstream/${UPSTREAM_DEFAULT_BRANCH}")" == "${META_SOURCE_SHA}" ]] || { echo "upstream advanced after candidate checks; refusing stale publication" >&2; exit 1; }
          [[ "$(git rev-parse "refs/remotes/origin/${MANAGED_BRANCH}")" == "${META_MANAGED_SHA}" ]] || { echo "managed advanced after candidate checks; refusing publication" >&2; exit 1; }
          SOURCE_SHA="${META_SOURCE_SHA}"
          MANAGED_SHA="${META_MANAGED_SHA}"
          SYNC_BRANCH="${META_BRANCH:-upstream-sync/${SOURCE_SHA}}"

          if [[ "${META_STATUS}" == "NO_CHANGE" ]]; then
            MIRROR_SHA="$(git rev-parse "refs/remotes/origin/${MIRROR_BRANCH}")"
            git merge-base --is-ancestor "${MIRROR_SHA}" "${SOURCE_SHA}" || { echo "protected main mirror would require a non-fast-forward update" >&2; exit 1; }
            git -c "http.extraheader=AUTHORIZATION: bearer ${PUBLISH_TOKEN}" push origin "${SOURCE_SHA}:refs/heads/${MIRROR_BRANCH}"
            echo "UPSTREAM_SYNC_NO_CHANGE source_sha=${SOURCE_SHA} mirror=${MIRROR_BRANCH}"
            exit 0
          fi

          git bundle verify sync-artifact/candidate.bundle
          git fetch sync-artifact/candidate.bundle "refs/heads/${SYNC_BRANCH}:refs/remotes/bundle/${SYNC_BRANCH}"
          BUNDLE_TIP="$(git rev-parse "refs/remotes/bundle/${SYNC_BRANCH}")"
          [[ "${BUNDLE_TIP}" == "${META_COMMIT_SHA}" ]] || { echo "candidate bundle tip does not match metadata" >&2; exit 1; }
          [[ "${META_MERGE_SHA}" =~ ^[0-9a-f]{40}$ && "${META_TREE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "candidate topology metadata is invalid" >&2; exit 1; }
          node scripts/upstream-sync/verify-candidate-commit.mjs \
            --commit-sha "${BUNDLE_TIP}" \
            --merge-commit-sha "${META_MERGE_SHA}" \
            --managed-sha "${MANAGED_SHA}" \
            --source-sha "${SOURCE_SHA}" \
            --tree-sha "${META_TREE_SHA}" \
            --allow-untracked-prefix "sync-artifact/"

          EXISTING_TIP="$(git -c "http.extraheader=AUTHORIZATION: bearer ${PUBLISH_TOKEN}" ls-remote origin "refs/heads/${SYNC_BRANCH}" | awk '{print $1; exit}')"
          if [[ -n "${EXISTING_TIP}" ]]; then
            git -c "http.extraheader=AUTHORIZATION: bearer ${PUBLISH_TOKEN}" fetch origin "${SYNC_BRANCH}"
            if node scripts/upstream-sync/verify-candidate-commit.mjs \
              --commit-sha "${EXISTING_TIP}" \
              --merge-commit-sha "${META_MERGE_SHA}" \
                --managed-sha "${MANAGED_SHA}" \
                --source-sha "${SOURCE_SHA}" \
                --tree-sha "${META_TREE_SHA}" \
                --allow-untracked-prefix "sync-artifact/"; then
              PUBLISHED_TIP="${EXISTING_TIP}"
            else
              RECOVERY_BRANCH="${META_BRANCH}-${MANAGED_SHA}"
              [[ "${RECOVERY_BRANCH}" =~ ^upstream-sync/[0-9a-f]{40}-[0-9a-f]{40}$ ]] || { echo "candidate recovery branch metadata is invalid" >&2; exit 1; }
              RECOVERY_TIP="$(git -c "http.extraheader=AUTHORIZATION: bearer ${PUBLISH_TOKEN}" ls-remote origin "refs/heads/${RECOVERY_BRANCH}" | awk '{print $1; exit}')"
              if [[ -n "${RECOVERY_TIP}" ]]; then
                git -c "http.extraheader=AUTHORIZATION: bearer ${PUBLISH_TOKEN}" fetch origin "${RECOVERY_BRANCH}"
                node scripts/upstream-sync/verify-candidate-commit.mjs \
                  --commit-sha "${RECOVERY_TIP}" \
                  --merge-commit-sha "${META_MERGE_SHA}" \
                  --managed-sha "${MANAGED_SHA}" \
                  --source-sha "${SOURCE_SHA}" \
                  --tree-sha "${META_TREE_SHA}" \
                  --allow-untracked-prefix "sync-artifact/"
                PUBLISHED_TIP="${RECOVERY_TIP}"
              else
                git -c "http.extraheader=AUTHORIZATION: bearer ${PUBLISH_TOKEN}" push origin "${BUNDLE_TIP}:refs/heads/${RECOVERY_BRANCH}"
                SYNC_BRANCH="${RECOVERY_BRANCH}"
                PUBLISHED_TIP="${BUNDLE_TIP}"
              fi
            fi
          else
            git -c "http.extraheader=AUTHORIZATION: bearer ${PUBLISH_TOKEN}" push origin "${BUNDLE_TIP}:refs/heads/${SYNC_BRANCH}"
            PUBLISHED_TIP="${BUNDLE_TIP}"
          fi

          CURRENT_MANAGED_SHA="$(git -c "http.extraheader=AUTHORIZATION: bearer ${PUBLISH_TOKEN}" ls-remote origin "refs/heads/${MANAGED_BRANCH}" | awk '{print $1; exit}')"
          [[ "${CURRENT_MANAGED_SHA}" == "${MANAGED_SHA}" ]] || { echo "managed advanced before PR publication; refusing stale PR" >&2; exit 1; }
          git -c "http.extraheader=AUTHORIZATION: bearer ${PUBLISH_TOKEN}" push origin "${SOURCE_SHA}:refs/heads/${MIRROR_BRANCH}"

          PR_TITLE="chore(upstream): sync ${SOURCE_SHA}"
          PR_BODY="$(cat <<EOF
          ## Reviewed upstream sync

          Source repository: [${UPSTREAM_REPOSITORY}](https://github.com/${UPSTREAM_REPOSITORY})
          Default branch: \`${UPSTREAM_DEFAULT_BRANCH}\`
          Source SHA: \`${SOURCE_SHA}\`
          Managed base SHA: \`${MANAGED_SHA}\`
          Mirror branch: \`${MIRROR_BRANCH}\`
          Candidate branch: \`${SYNC_BRANCH}\`
          Candidate commit: \`${PUBLISHED_TIP}\`
          Target branch: \`${MANAGED_BRANCH}\`

          The candidate job ran with contents-read permission, no persisted checkout token,
          and no publisher credentials. The publisher imported an exact bundle and verified
          the merge parents, generated commit tree, lock/corpus/receipt paths, current managed
          base, and fast-forward-only mirror before opening this PR.

          Classification: \$(jq -c '.categories' sync-artifact/classification.json)
          Blocked reasons: \$(jq -c '.blockedReasons' sync-artifact/classification.json)

          Checks run before publication:
          - \`npm run verify:upstream-corpus\`
          - \`npm run check:managed\`
          - \`npm run test\`
          - \`npm run build\`
          - Apache-2.0 license policy
          - upstream-sync workflow contract tests

          No automatic merge, release, deploy, force push, rebase, or workflow self-modification is permitted.
          EOF
          )"
          PR_NUMBER="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --base "${MANAGED_BRANCH}" --head "${GITHUB_REPOSITORY_OWNER}:${SYNC_BRANCH}" --json number --jq '.[0].number // empty')"
          if [[ -n "${PR_NUMBER}" ]]; then
            gh pr edit "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --title "${PR_TITLE}" --body "${PR_BODY}"
            echo "UPSTREAM_SYNC_PR_UPDATED source_sha=${SOURCE_SHA} pr=${PR_NUMBER}"
          else
            gh pr create --repo "${GITHUB_REPOSITORY}" --base "${MANAGED_BRANCH}" --head "${GITHUB_REPOSITORY_OWNER}:${SYNC_BRANCH}" --title "${PR_TITLE}" --body "${PR_BODY}"
            echo "UPSTREAM_SYNC_PR_CREATED source_sha=${SOURCE_SHA}"
          fi
          PR_NUMBER="$(gh pr list --repo "${GITHUB_REPOSITORY}" --state open --base "${MANAGED_BRANCH}" --head "${GITHUB_REPOSITORY_OWNER}:${SYNC_BRANCH}" --json number --jq '.[0].number // empty')"
          [[ -n "${PR_NUMBER}" ]] || { echo "managed pull request could not be read back" >&2; exit 1; }
          gh pr checks "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --watch --fail-fast

  report-blocked:
    if: needs.candidate.outputs.sync_status == 'blocked'
    needs: candidate
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download blocked classification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: steel-upstream-sync-${{ needs.candidate.outputs.source_sha || github.run_id }}
          path: sync-artifact

      - name: Report one deduplicated blocked review item
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(jq -r '.sourceSha' sync-artifact/candidate-metadata.json)"
          TITLE="upstream sync blocked: ${SOURCE_SHA}"
          BODY="$(cat <<EOF
          The reviewed upstream sync is blocked and did not create a candidate branch or PR.

          Source SHA: \`${SOURCE_SHA}\`
          Classification: \$(jq -c '.categories' sync-artifact/classification.json)
          Blocked reasons: \$(jq -c '.blockedReasons' sync-artifact/classification.json)

          A human must capture the exact upstream runtime corpus and complete the listed review
          before rerunning sync. The workflow never copies an older observed receipt.
          EOF
          )"
          ISSUE_NUMBER="$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "${TITLE} in:title" --json number --jq '.[0].number // empty')"
          if [[ -n "${ISSUE_NUMBER}" ]]; then
            gh issue edit "${ISSUE_NUMBER}" --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --body "${BODY}"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${TITLE}" --body "${BODY}" --label "status: blocked"
          fi
