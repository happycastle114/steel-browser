name: Managed pull request gates

on:
  pull_request:
    branches:
      - managed

permissions: {}

concurrency:
  group: steel-managed-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  gates:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out reviewed managed pull request without credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.23.1
          cache: npm

      - name: Run managed pull request gates
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          node scripts/upstream-sync/verify-workflow.mjs
          node --test scripts/upstream-sync/*.test.mjs
          npm run verify:upstream-corpus
          npm run check:managed
          npm run test
          npm run build
          node scripts/upstream-sync/verify-license.mjs
          git diff --check
