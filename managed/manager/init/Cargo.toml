[package]
name = "steel-manager-init"
version = "0.0.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
publish = false

[dependencies]
thiserror = "=2.0.19"
zeroize = "=1.9.0"
sha2 = "=0.11.0"

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.30.1", features = ["fs", "process", "user"] }

[target.'cfg(target_os = "linux")'.dependencies]
anyhow = "=1.0.100"
caps = "=0.5.5"

[lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"
non_ascii_idents = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
